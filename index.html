<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipo</title>
<style>
  :root {
    --blau: #004d98;
    --grana: #a50044;
    --gold: #edbb00;
    --cream: #f5f1e8;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: #0d1117;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--cream);
  }

  /* ---------- Barra de navegación ---------- */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: center;
    gap: 0.5rem; padding: 0 1rem;
    background: rgba(13,17,23,0.95);
    border-bottom: 4px solid transparent;
    border-image: repeating-linear-gradient(90deg,
      var(--blau) 0 40px, var(--grana) 40px 80px) 1;
    z-index: 10;
    overflow-x: auto;
  }
  nav a {
    color: var(--gold); text-decoration: none; white-space: nowrap;
    font-family: Georgia, serif;
    border: 1px solid transparent; border-radius: 999px;
    padding: 0.4rem 1.1rem;
    transition: background .2s, color .2s;
  }
  nav a:hover { border-color: var(--gold); }
  nav a.activo { background: var(--gold); color: #0d1117; }

  /* ---------- Contenido ---------- */
  main { padding-top: var(--nav-h); height: 100%; }

  /* Página de Leonardo */
  #inicio {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 30% 20%, rgba(0,77,152,0.55), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(165,0,68,0.55), transparent 55%),
      #0d1117;
  }
  .card { text-align: center; padding: 3rem 1.5rem; }
  .eyebrow {
    font-family: Georgia, serif; font-style: italic;
    color: var(--gold); font-size: 1.1rem; margin-bottom: 0.8rem;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
    font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -0.01em;
  }
  .underline {
    width: 90px; height: 4px; margin: 1.5rem auto 0;
    background: linear-gradient(90deg, var(--blau), var(--grana));
    border-radius: 2px;
  }

  /* Páginas de los compañeros */
  iframe { display: none; width: 100%; height: 100%; border: none; background: #fff; }

  main.ver-iframe #inicio { display: none; }
  main.ver-iframe iframe { display: block; }
</style>
</head>
<body>

  <!-- Un enlace por compañero: data-pagina = nombre del archivo -->
  <nav id="menu">
    <a href="#" data-pagina="inicio" class="activo">Leonardo</a>
    <a href="#" data-pagina="airis.html">Airis</a>
    <a href="#" data-pagina="joel.html">Joel</a>
    <!-- <a href="#" data-pagina="gallegos.html">A. Gallegos</a> -->
    <!-- <a href="#" data-pagina="prado.html">L. Prado</a> -->
  </nav>

  <main id="contenido">
    <section id="inicio">
      <div class="card">
        <div class="eyebrow">Visca el Barça</div>
        <h1>Leonardo Pérez</h1>
        <div class="underline"></div>
      </div>
    </section>
    <iframe id="visor" title="Página de compañero"></iframe>
  </main>

<script>
  const menu = document.getElementById('menu');
  const contenido = document.getElementById('contenido');
  const visor = document.getElementById('visor');

  function mostrar(pagina) {
    menu.querySelectorAll('a').forEach(a =>
      a.classList.toggle('activo', a.dataset.pagina === pagina));
    if (pagina === 'inicio') {
      contenido.classList.remove('ver-iframe');
    } else {
      visor.src = pagina;
      contenido.classList.add('ver-iframe');
    }
  }

  menu.addEventListener('click', e => {
    const link = e.target.closest('a');
    if (!link) return;
    e.preventDefault();
    mostrar(link.dataset.pagina);
  });
</script>

</body>
</html>
